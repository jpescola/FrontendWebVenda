<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Vendas</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <h1>Vendas</h1>
    <p>
        <a th:href="@{/vendas/novo}">Cadastrar Venda</a>
    </p>
    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Data</th>
            <th>Valor</th>
            <th>Cliente</th>
            <th>Vendedor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${vendas}">
            <td th:text="${#temporals.format(prod.data(), 'dd/MM/yyyy')}"></td>
            <td th:text="${prod.valor()}"></td>
            <td th:text="${prod.cliente().nome()}"></td>
            <td th:text="${prod.vendedor().nome()}"></td>
            <td>
                <a th:href="@{/vendas/editar/{id}(id=${prod.id()})}">Editar</a>
                <a th:href="@{/vendas/excluir/{id}(id=${prod.id()})}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
