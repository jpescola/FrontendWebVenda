<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cliente</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <h1 th:text="${cliente.id != null} ? 'Editar Cliente' : 'Cadastrar Cliente'"></h1>
    <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}" />
        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" th:field="*{nome}" required />
        </p>
        <p>
            <label for="renda">Renda:</label><br>
            <input type="number" id="renda" th:field="*{renda}" required />
        </p>
        <p>
            <button type="submit">Salvar</button>
            <a th:href="@{/clientes}">Cancelar</a>
        </p>
    </form>
</body>
</html>
