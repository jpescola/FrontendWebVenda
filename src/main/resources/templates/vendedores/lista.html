<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Vendedores</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <h1>Vendedores</h1>
    <p>
        <a th:href="@{/vendedores/novo}">Cadastrar Vendedor</a>
    </p>
    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>Foto</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${vendedores}">
            <td>
                <img th:src="@{${apiBaseUrl} + ${prod.foto()}}" alt="Foto do Vendedor" width="30" />
            </td>
            <td th:text="${prod.nome()}"></td>
            <td>
                <a th:href="@{/vendedores/editar/{id}(id=${prod.id()})}">Editar</a>
                <a th:href="@{/vendedores/excluir/{id}(id=${prod.id()})}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
